  <h1>Uso de Componentes bootstrap</h1>
  
    <!-- Task3: Diseño básico con rejilla y Flexbox -->
    <div class="container my-4">
      <div class="row mb-4">
        <div class="col-2 p-3 border text-center">El lado izquierdo</div>
        <div class="col-8 p-4 border text-center">
          <p class="fw-bold">El lado central</p>
          <!-- Task2: Botón y alerta dinámica -->
          <div class="mb-4">
            <div id="liveAlertPlaceholder" class="mt-3" ></div>
            <button type="button" class="btn btn-danger flex-grow-0" id="liveAlertBtn">El botón</button>
          </div>
          <!-- Task4: Formulario básico -->
           <form class="mb-4 p-3 rounded">
            <div class="mb-3">
              <label for="correo" class="form-label text-dark">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" placeholder="  Escribe tu correo">
            </div>
            <div class="mb-3">
              <label for="texto" class="form-label" text-dark>Área de texto</label>
              <textarea class="form-control" id="texto" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Enviar</button>
           </form>
        </div>

        <div class="col-2 p-3 border text-center">El lado derecho</div>
      </div>
      <div class="row">
        <div class="col-12 text-center bg-dark text-white py-3">Pie de página</div>
      </div>
    </div>
