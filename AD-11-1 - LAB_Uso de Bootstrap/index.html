<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Laboratorio de Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <!-- contenedor de anchura variable -->
  <div class="container-fluid" bg-light min-vh-100 p-4>
    <header class="encabezado">
      <h1 class="Titulo">Laboratorio: Uso de Bootstrap</h1>
      <p class="m1">Todo el contenido de este sitio se encuentra dentro del contenedor de anchura variable.</p>
    </header>

  <!-- Tres botones con diferentes colores -->
    <div class="botones">
      <h3>Tarea 3: Botones</h3>
      <button type="button" class="btn-solid theme-primary">Acerca de mi</button>
      <button type="button" class="btn-outline theme-accent">Github</button>
      <button type="button" class="btn-subtle theme-inverse">Linkedin</button>
      <button type="button" class="btn-text theme-secondary">Contacto</button>
    </div>

  <!-- Utilidades para alinear texto y cambiar color -->
    <div class="texto">
      <h3>Tarea 4: Alineación de Texto</h3>
      <p class="text-start">Izquierda</p>
      <p class="text-center">Centro</p>
      <p class="text-end">Derecha</p>
    </div>

  <!-- Tarjeta con imagen y grupo de lista -->
    <div class="tarjeta">
      <h3>Tarea 5: Tarjeta y Lista</h3>
        <div class="card" style="width: 18rem;">
          <div class="card-header fw-bold">Hoja de ruta</div>
          <img src="Pics/cestofrutas.jpg" class="card-img" alt="Cesta de fruta">
          <ul class="lista lista-flush">
            <li class="lista-item">Manzana</li>
            <li class="lista-item">Mandarina</li>
            <li class="lista-item">Durazno</li>
          </ul>
        </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
